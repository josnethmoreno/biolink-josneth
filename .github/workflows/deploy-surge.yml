name: Deploy to Surge

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: surge-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Publish to josneth.surge.sh
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          if [ -z "$SURGE_TOKEN" ]; then
            echo "SURGE_TOKEN is missing. Add it in repository Actions secrets."
            exit 1
          fi
          npx --yes surge@0.44.4 ./dist josneth.surge.sh
